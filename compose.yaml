services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fieldflow
      POSTGRES_PASSWORD: fieldflow
      POSTGRES_DB: fieldflow
    ports:
      - "5433:5432"
    volumes:
      - fieldflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldflow -d fieldflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fieldflow_postgres_data:
